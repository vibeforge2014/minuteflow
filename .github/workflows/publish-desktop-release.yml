name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build desktop apps run ID
        required: true
        type: string
      version:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: meeting-assistant-Windows
          path: artifacts/windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: meeting-assistant-macOS
          path: artifacts/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          windows_installer="$(find artifacts/windows -type f -name '*Setup.exe' -print -quit)"
          mac_dmg="$(find artifacts/macos -type f -name '*.dmg' -print -quit)"
          mac_zip="$(find artifacts/macos -type f -name '*.zip' -print -quit)"
          test -n "$windows_installer"
          test -n "$mac_dmg"
          test -n "$mac_zip"
          mkdir -p release
          cp "$windows_installer" "release/会议助手-Setup-${release_version}-Windows-x64.exe"
          cp "$mac_dmg" "release/会议助手-${release_version}-macOS-arm64.dmg"
          cp "$mac_zip" "release/会议助手-${release_version}-macOS-arm64.zip"
          cd release
          sha256sum ./* > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "会议助手 $RELEASE_TAG" \
            --notes "首个 TuneSync 暖橙视觉版本，包含全新会议文档与波形图标、简化的本地 Whisper 模型发现/下载、New API 兼容、Markdown 笔记导入与渲染，以及录音停止时等待最后音频块落盘的修复。

          下载说明：macOS 提供 Apple Silicon DMG/ZIP，Windows 提供 x64 安装程序，并附 SHA-256 校验文件。

          这是未签名的测试构建。macOS 首次打开可能需要右键选择“打开”，Windows 可能显示 SmartScreen 提示。"
