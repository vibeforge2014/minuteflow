name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build desktop apps run ID
        required: true
        type: string
      version:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MinuteFlow-Windows
          path: artifacts/windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MinuteFlow-macOS
          path: artifacts/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          windows_installer="$(find artifacts/windows -type f -name '*Setup.exe' -print -quit)"
          mac_dmg="$(find artifacts/macos -type f -name '*.dmg' -print -quit)"
          mac_zip="$(find artifacts/macos -type f -name '*.zip' -print -quit)"
          test -n "$windows_installer"
          test -n "$mac_dmg"
          test -n "$mac_zip"
          mkdir -p release
          cp "$windows_installer" "release/MinuteFlow-Setup-${release_version}-Windows-x64.exe"
          cp "$mac_dmg" "release/MinuteFlow-${release_version}-macOS-arm64.dmg"
          cp "$mac_zip" "release/MinuteFlow-${release_version}-macOS-arm64.zip"
          cd release
          sha256sum ./* > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MinuteFlow $RELEASE_TAG" \
              --notes "本版本聚焦易用性：会议库新增收藏置顶与行内快速收藏，搜索命中词在标题中高亮；新建会议支持“创建并开始录音”一键开会（仍走完整的麦克风校验与授权流程）；录音回放新增倍速播放（会话内记忆）与空格/左右方向键操作；发现新版本时可从提示一键直达“设置 → 软件更新”。

            下载说明：macOS 提供 Apple Silicon DMG/ZIP，Windows 提供 x64 安装程序，并附 SHA-256 校验文件。

            这是未签名的测试构建。macOS 首次打开可能需要右键选择“打开”，Windows 可能显示 SmartScreen 提示。"
          fi

      - name: Update website macOS manifest
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          node scripts/write-release-manifest.mjs \
            --version "$release_version" \
            --dmg "release/MinuteFlow-${release_version}-macOS-arm64.dmg" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git diff --quiet -- public/releases/latest-macos.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases/latest-macos.json
          git commit -m "更新 macOS 官网更新清单 ${RELEASE_TAG}"
          git push origin main
