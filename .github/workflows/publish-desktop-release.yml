name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build desktop apps run ID
        required: true
        type: string
      version:
        description: Release tag, for example v0.1.1
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MinuteFlow-Windows
          path: artifacts/windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MinuteFlow-macOS
          path: artifacts/macos
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 手填 tag 与另一次 build_run_id 的产物是发布事故的主要来源：先确认
      # tag 格式、与 package.json 版本一致，且安装包文件名里的版本也一致。
      - name: Verify release tag and artifact versions
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          node scripts/verify-release.mjs \
            --tag "$RELEASE_TAG" \
            --artifacts artifacts/windows artifacts/macos

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          windows_installer="$(find artifacts/windows -type f -name '*Setup.exe' -print -quit)"
          mac_dmg="$(find artifacts/macos -type f -name '*.dmg' -print -quit)"
          mac_zip="$(find artifacts/macos -type f -name '*.zip' -print -quit)"
          test -n "$windows_installer"
          test -n "$mac_dmg"
          test -n "$mac_zip"
          mkdir -p release
          cp "$windows_installer" "release/MinuteFlow-Setup-${release_version}-Windows-x64.exe"
          cp "$mac_dmg" "release/MinuteFlow-${release_version}-macOS-arm64.dmg"
          cp "$mac_zip" "release/MinuteFlow-${release_version}-macOS-arm64.zip"
          cd release
          sha256sum ./* > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
          SIGNED_RELEASE: ${{ vars.MINUTEFLOW_SIGNED_RELEASE }}
        run: |
          set -euo pipefail
          # 发布说明按版本动态生成，不再写死某次迭代的功能描述与签名状态。
          notes="$(mktemp)"
          {
            echo "## MinuteFlow $RELEASE_TAG"
            echo
            echo "下载说明：macOS 提供 Apple Silicon DMG / ZIP，Windows 提供 x64 安装程序；SHA256SUMS.txt 可用于校验文件完整性。"
            echo
            if [ "$SIGNED_RELEASE" = "1" ]; then
              echo "本版本的 macOS 构建已完成签名与公证。"
            else
              echo "macOS 首次打开若被系统拦截，请在「系统设置 → 隐私与安全性」中允许；Windows 可能出现 SmartScreen 提示。"
            fi
            echo
            echo "更新内容见本版本包含的提交记录与更新日志。"
          } > "$notes"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MinuteFlow $RELEASE_TAG" \
              --notes-file "$notes"
          fi

      - name: Update website macOS manifest
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          node scripts/write-release-manifest.mjs \
            --version "$release_version" \
            --dmg "release/MinuteFlow-${release_version}-macOS-arm64.dmg" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if git diff --quiet -- public/releases/latest-macos.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases/latest-macos.json
          git commit -m "更新 macOS 官网更新清单 ${RELEASE_TAG}"
          git push origin main

      # GITHUB_TOKEN 的推送不会触发新的 workflow（防递归），显式派发站点部署。
      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY"
