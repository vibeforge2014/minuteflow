name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - public/releases/latest-macos.json
      - public/releases/latest-windows.json
      - public/downloads/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:main
      - run: npm test
      - run: npm run test:license
      - run: npm run build
      # test:sites 断言 dist/ 产物存在，必须在 build 之后跑
      - run: npm run test:sites

  package:
    needs: verify
    strategy:
      matrix:
        # GitHub 于 2026-11-02 退役 macos-14（arm64）镜像，旧 label 会直接被拒。
        # macos-15 是同为 Apple Silicon 的官方替代品，保证 DMG 仍是 arm64。
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # 默认仍产出 ad-hoc 本地构建。把仓库变量 MINUTEFLOW_RELEASE_BUILD 设为 1
    # 即启用严格模式：macOS 缺少签名身份或公证凭据时打包直接失败，避免把
    # 不可分发的 DMG 当成"绿色"产物发布。启用前需在 macOS runner 导入 Developer ID
    # 证书并配置 notarytool keychain profile，同时提供下列 secrets。
    env:
      MINUTEFLOW_RELEASE_BUILD: ${{ vars.MINUTEFLOW_RELEASE_BUILD }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_NOTARY_KEY_PATH: ${{ secrets.APPLE_NOTARY_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 正式发布（MINUTEFLOW_RELEASE_BUILD=1）时，把签名证书与公证密钥注入 runner；
      # 非发布构建跳过，绝不把 ad-hoc 构建误当成可分发产物。
      - name: Import Developer ID certificate
        if: ${{ env.MINUTEFLOW_RELEASE_BUILD == '1' && runner.os == 'macOS' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-cert.p12"
          security import "$RUNNER_TEMP/apple-cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # 允许 codesign 非交互式访问私钥（否则签名卡在钥匙串授权弹窗）。
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "$CERT_PASSWORD" "$KEYCHAIN"
          echo "APPLE_IDENTITY=Developer ID Application: Zhen Qian (LPW4Z3BN69)" >> "$GITHUB_ENV"
      - name: Materialize App Store Connect API key
        if: ${{ env.MINUTEFLOW_RELEASE_BUILD == '1' && runner.os == 'macOS' }}
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          # notarytool 按文件名里的 Key ID 识别密钥，文件名必须与 APPLE_API_KEY_ID 一致。
          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: MinuteFlow-${{ runner.os }}
          path: out/make/**
