name: Backfill R2 release mirror

# 一次性/补救用途：把 GitHub Releases 的全部安装包、最新更新清单和声纹模型
# 全量回填到 Cloudflare R2 桶 minuteflow-releases，键位与官网路径一致：
#   s3://minuteflow-releases/<tag>/<file>   ← zensoft.top/minuteflow/dl/<tag>/<file>
#   s3://minuteflow-releases/releases/*.json ← zensoft.top/minuteflow/releases/*
#   s3://minuteflow-releases/models/*.onnx  ← zensoft.top/minuteflow/dl/models/
# 回填完成、抽查确认后才允许部署 worker/minuteflow-dl（Worker 抢先上线会让
# 尚未入桶的旧版本直链 404）。总资产约 10GB，超出 R2 免费 10GB 的部分按
# $0.015/GB·月 计费（约几厘/月）；需要清理旧版本时直接删除对应 <tag>/ 前缀，
# 源站 dl/ 目录保留完整副本可随时恢复。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-r2-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Require R2 credentials
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$R2_S3_ENDPOINT" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::缺少 R2_S3_ENDPOINT / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY 仓库密钥。先在 Cloudflare 启用 R2，再把 S3 凭据录入仓库 secrets。"
            exit 1
          fi

      - name: Ensure bucket exists
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_supported
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
        run: |
          set -euo pipefail
          aws s3 mb "s3://minuteflow-releases" --endpoint-url "$R2_S3_ENDPOINT" \
            || echo "桶已存在，继续。"

      - name: Backfill every release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_supported
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
        run: |
          set -euo pipefail
          verify_sums() {
            local target="$1" sums="$2" label="$3"
            local name expected actual
            name="$(basename "$target")"
            expected="$(tr -d '\r' < "$sums" \
              | awk -v n="$name" '$2 ~ ("/" n "$") || $2 == n { print $1; exit }')"
            [ -z "$expected" ] && return 0
            actual="$(sha256sum "$target" | awk '{print $1}')"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$label 校验不符（期望 $expected，实际 $actual）"
              return 1
            fi
          }
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')"
          total=0
          for tag in $tags; do
            echo "=== $tag ==="
            rm -rf release && mkdir -p release
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release \
              --pattern '*.dmg' --pattern '*Setup*.exe' --pattern '*.sha256' --pattern '*SHA256*' || {
              echo "::warning::$tag 没有可同步资产，跳过"; continue; }
            dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
            exe="$(find release -maxdepth 1 -name '*Setup*.exe' -print -quit)"
            if [ -n "$exe" ] && [ -f "${exe}.sha256" ]; then verify_sums "$exe" "${exe}.sha256" "$tag Windows"; fi
            sums="$(find release -maxdepth 1 -iname '*SHA256*.txt' -print -quit)"
            if [ -n "$dmg" ] && [ -n "$sums" ]; then verify_sums "$dmg" "$sums" "$tag DMG"; fi
            aws s3 cp release/ "s3://minuteflow-releases/$tag/" --recursive \
              --endpoint-url "$R2_S3_ENDPOINT" --content-type "application/octet-stream"
            tag_bytes="$(du -sb release | awk '{print $1}')"
            total=$((total + tag_bytes))
            echo "$tag 同步完成（$tag_bytes 字节）。"
          done
          echo "全部版本合计 $total 字节。"

      - name: Backfill manifests and model
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_supported
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported
          EMBEDDING_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx
          EMBEDDING_SHA256: bf1a75b9930474cf3389ef415e6e5d38ca96fea4a3a00f7e301d080a58ee2239
        run: |
          set -euo pipefail
          aws s3 cp public/releases/ s3://minuteflow-releases/releases/ --recursive \
            --endpoint-url "$R2_S3_ENDPOINT" --content-type "application/json" \
            --exclude '*' --include 'latest-*.json'
          mkdir -p models
          curl -fsSL --retry 3 -o models/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx "$EMBEDDING_URL"
          echo "$EMBEDDING_SHA256  models/3dspeaker_speech_eres2netv2_sv_zh-cn_16k-common.onnx" | sha256sum -c -
          aws s3 cp models/ s3://minuteflow-releases/models/ --recursive \
            --endpoint-url "$R2_S3_ENDPOINT" --content-type "application/octet-stream"
          echo "清单与模型回填完成。"

      - name: Summarize bucket
        env:
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 ls s3://minuteflow-releases/ --recursive --endpoint-url "$R2_S3_ENDPOINT" --summarize | tail -3
